apis:
- aid: fcc:license-view
  name: FCC License View API
  description: >-
    Provides information about FCC-issued licenses for use of the nation's airwaves, including snapshots
    of license counts across different radio services such as 700 MHz, 800 MHz Cellular, AWS, PCS, BRS,
    EBS, and 2.3 GHz WCS bands.
  humanURL: https://www.fcc.gov/reports-research/developers/license-view-api
  baseURL: https://data.fcc.gov/api/license-view
  tags:
  - Radio Licensing
  - Spectrum
  properties:
  - type: Documentation
    url: https://www.fcc.gov/reports-research/developers/license-view-api
- aid: fcc:spectrum-dashboard
  name: FCC Spectrum Dashboard API
  description: >-
    Returns a high-level overview of spectrum ownership across the United States within the 225 MHz to
    3700 MHz frequency range, including call sign, licensee name, common name, radio service code, and
    market information.
  humanURL: https://www.fcc.gov/reports-research/developers/spectrum-dashboard-api
  baseURL: https://data.fcc.gov/api/spectrum-view
  tags:
  - Spectrum
  - Auctions
  properties:
  - type: Documentation
    url: https://www.fcc.gov/reports-research/developers/spectrum-dashboard-api
- aid: fcc:ecfs
  name: FCC Electronic Comment Filing System (ECFS) API
  description: >-
    Enables external users and organizations to search the FCC Electronic Comment Filing System (ECFS)
    for regulatory filings and public comments without using the web interface. Free API key registration
    available.
  humanURL: https://www.fcc.gov/ecfs/help/public_api
  baseURL: https://ecfs.fcc.gov/api
  tags:
  - Regulatory Filings
  - Public Comments
  - ECFS
  properties:
  - type: Documentation
    url: https://www.fcc.gov/ecfs/help/public_api
  - type: Documentation
    url: https://www.fcc.gov/ecfs/public-api-docs.html
- aid: fcc:consumer-complaints
  name: FCC Consumer Complaints Center Data API
  description: >-
    Provides access to consumer complaint data submitted to the FCC, including complaints about telephone,
    internet, television, and radio services.
  humanURL: https://www.fcc.gov/consumer-help-center-api
  baseURL: https://www.fcc.gov/consumer-help-center-api
  tags:
  - Consumer Complaints
