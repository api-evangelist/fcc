  properties:
  - type: Documentation
    url: https://publicfiles.fcc.gov/developer
- aid: fcc:broadband-data-collection
  name: FCC Broadband Data Collection (BDC) API
  description: >-
    Allows ISPs and developers to interface with the FCC Broadband Data Collection system via API endpoints,
    including the ability to respond to fixed availability challenges programmatically.
  humanURL: >-
